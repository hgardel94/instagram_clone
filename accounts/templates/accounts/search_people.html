{% extends 'base.html' %}
{% load static %}

{% block content %}
{% include 'navbar.html' %}

<div class="container mt-5 content-search">
    <h3>Cuentas a las que Seguir</h3>
    <div class="row row-eq-height row-search">
        {% for person in people %}
        <div class="col-md-4 mt-4 d-flex align-items-stretch">
            <div class="card mb-4">
                <div class="mt-2 ms-3 grid">
                    <img class="profile-pic-search" src="{{ person.profile.image.url }}" class="card-img-top" alt="Profile Image">
                </div>
                <div class="card-body d-flex flex-column card-search">
                    <h5 class="card-title">{{ person.username }}</h5>
                    <a href="{% url 'accounts:follow_user' person.id %}" class="btn btn-primary follow-btn">
                        Seguir
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
